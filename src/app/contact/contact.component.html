<!-- src/app/contact/contact.component.html -->

<section class="contact-header">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you! Get in touch or visit us in Austin.</p>
</section>

<div class="contact-container">
  <!-- Contact Card -->
  <mat-card class="contact-card">
    <mat-card-header>
      <mat-card-title>Store Location</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p><mat-icon>location_on</mat-icon> 4101 W Parmer Ln, Unit C, Austin, TX 78727</p>
      <p><mat-icon>phone</mat-icon> <a href="tel:5126161212">512-616-1212</a></p>
      <p><mat-icon>email</mat-icon> <a href="mailto:Desicafeusa@outlook.com">Desicafeusa@outlook.com</a></p>
    </mat-card-content>
  </mat-card>

  <!-- WhatsApp + Social Links -->
  <mat-card class="contact-card">
    <mat-card-header>
      <mat-card-title>Connect With Us</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <button mat-raised-button color="primary" class="whatsapp-btn" (click)="openWhatsApp()">
        <mat-icon>chat</mat-icon> Request Info on WhatsApp
      </button>

      <div class="social-links">
        <p>Follow Us:</p>
        <a href="https://facebook.com/Desiliciouscafe" target="_blank"><mat-icon>facebook</mat-icon></a>
        <a href="https://instagram.com/desiliciouscafe" target="_blank"><mat-icon>photo_camera</mat-icon></a>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Delivery Partners -->
  <mat-card class="contact-card">
    <mat-card-header>
      <mat-card-title>Our Delivery Partners</mat-card-title>
    </mat-card-header>
    <mat-card-content class="partners">
      <img src="../../assets/Doordash.png" alt="Doordash" />
      <img src="../../assets/Ubereats.png" alt="Uber Eats" />
      <img src="../../assets/toast.png" alt="Toast" />
    </mat-card-content>
  </mat-card>
</div>
